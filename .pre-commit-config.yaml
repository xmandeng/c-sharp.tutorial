# Install once per clone:  pre-commit install
# Run on everything:       pre-commit run --all-files
default_install_hook_types: [pre-commit, pre-push]

# Files written by the .NET tools; leave their formatting alone.
exclude: (^|/)(packages\.lock\.json|dotnet-tools\.json)$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
        exclude: ^\.vscode/ # VS Code files are JSON with comments
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=2000"] # admits the textbook PDF

  - repo: local
    hooks:
      # On commit: format staged C# files (the C# side of ruff format).
      - id: csharpier
        name: csharpier format
        entry: dotnet csharpier format
        language: system
        types: [c#]

      # On push: build with analyzers as errors (the C# side of ruff check), then test.
      - id: dotnet-build
        name: dotnet build (analyzers, warnings as errors)
        entry: dotnet build --warnaserror
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: dotnet-test
        name: dotnet test
        entry: dotnet test
        language: system
        pass_filenames: false
        stages: [pre-push]
